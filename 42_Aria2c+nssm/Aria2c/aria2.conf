# 这个要放在第 4 行, 方便脚本更新配置文件
# 文件的保存路径(可使用绝对路径或相对路径), 默认: 当前启动位置
dir=D:\#03-Aria2c

# 启用磁盘缓存, 0为禁用缓存, 需1.16以上版本, 默认:16M
# disk-cache=256M

# 文件预分配方式, 能有效降低磁盘碎片, 默认:prealloc
# 预分配所需时间: none < falloc < trunc < prealloc
# NTFS建议使用falloc
file-allocation=falloc

# 断点续传
continue=true

# 是否校验证书,  默认 true
check-certificate=false

# 如果相应的控制文件不存在，则重新开始下载。另请参见--自动文件重命名选项。Default: false
allow-overwrite=true

# 始终保存控制文件? Default: false
force-save=true

# 检查文件完整性 默认值: false
# 如果打开这个选项, 每次启动或重启aria2以后, 而且任务列表还有任务, 不管是下完的还是没下完的, 都会开始校验数据.
check-integrity=false

#日志级别
log-level=warn
console-log-level=warn
debug, info, notice, warn or error. Default: debug
debug, info, notice, warn or error. Default: notice

# 代理服务器相关设定
# http-proxy=192.168.1.29:10801
# https-proxy=192.168.1.29:10801



# 最大同时下载任务数, 运行时可修改, 默认:5
max-concurrent-downloads=4

# 同一服务器连接数, 添加时可指定, 默认:1
max-connection-per-server=8

# 单任务连接数
# 同一服务器的连接数会被 --max-connection-per-server 选项限制
split=8

# 最小文件分片大小, 添加时可指定, 取值范围1M -1024M, 默认:20M
# 假定size=10M, 文件为20MiB 则使用两个来源下载; 文件为15MiB 则使用一个来源下载
min-split-size=5M

# 整体下载速度限制, 运行时可修改, 默认:0
max-overall-download-limit=20M

# 整体上传速度限制, 运行时可修改, 默认:0
max-overall-upload-limit=3M

# 单个任务下载速度限制, 默认:0
max-download-limit=0

# 单个任务上传速度限制, 默认:0
max-upload-limit=0

# 禁用IPv6, 默认:false
disable-ipv6=false

# 连接超时时间, 默认:60
timeout=10

# 最大重试次数, 设置为0表示不限制重试次数, 默认:5
max-tries=10

# 使用远程文件时间 Default: false
remote-time=true

# 重试等待时间秒
retry-wait=10

########## ########## ########## ########## ########## RPC相关设置 ########## ########## ########## ########## ##########

# 启用RPC, 默认:false
enable-rpc=true

# 允许所有来源, 默认:false
rpc-allow-origin-all=true

#在所有网卡上监听
#在所有网络适配器上监听 JSON-RPC/XML-RPC 的请求, 如果设置为"否", 仅监听本地网络的请求.
rpc-listen-all=true

#最大请求大小
#设置 JSON-RPC/XML-RPC 最大的请求大小. 如果 aria2 检测到请求超过设定的字节数, 会直接取消连接.
rpc-max-request-size=32M

# 事件轮询方式, 取值:[epoll, kqueue, port, poll, select], 不同系统默认值不同
event-poll=select

# RPC监听端口, 端口被占用时可以修改, 默认:6800
rpc-listen-port=16888

# 设置的RPC授权令牌, v1.18.4新增功能, 取代 --rpc-user 和 --rpc-passwd 选项
rpc-secret=Aria2C20201025hUdIshBoREVolons


########## ########## ########## ########## ########## BT/PT下载相关 ########## ########## ########## ########## ##########

# BT监听端口, 当端口被屏蔽时使用, 默认:6881-6999
listen-port=11111

# DHT网络监听端口, 默认:6881-6999
dht-listen-port=56800-56999

#分离仅做种任务
bt-detach-seed-only=true

# 当下载的是一个种子(以.torrent结尾)时, 自动开始BT任务, 默认:true
follow-torrent=true

# 单个种子最大连接数, 默认:55, 0=无限制
bt-max-peers=100

# 指定全局多文件 BitTorrent/Metalink 下载中打开的最大文件数。默认值：100
bt-max-open-files=50

# 打开DHT功能, PT需要禁用, 默认:true
enable-dht=true
enable-dht6=true

#DHT (IPv4) 文件 - 这里注销掉了, 改为命令行运行中指定
# dht-file-path=aria2-dht-v4.dat
# dht-file-path6=aria2-dht-v6.dat

# 加入 DHT 节点网络
dht-entry-point=dht.transmissionbt.com:6881
dht-entry-point6=dht.transmissionbt.com:6881

# 本地节点查找, PT需要禁用, 默认:false
bt-enable-lpd=true

# 种子交换, PT需要禁用, 默认:true
enable-peer-exchange=true

# BT的期望下载速度
# bt-request-peer-speed-limit=10M

# UA
# user-agent=Mozilla/5.0 (Windows NT 10.0; WOW64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.5666.197 Safari/537.36

# UA - QB 4.6.0
user-agent=qBittorrent/4.6.0
peer-id-prefix=-qB4600-
peer-agent=qBittorrent/4.6.0

# UA - TR 2.77
# user-agent=Transmission/2.77
# peer-id-prefix=-TR2770-
# user-agent=Transmission/2.77

# UA - QB 4.1.7
# user-agent=qBittorrent/4.1.7
# peer-id-prefix=-qB4170-
# peer-agent=qBittorrent/4.1.7



# 最小做种时间(单位/分钟) 1天=1440, 1周=10080, 0=无限制时间改用分享率判定.
seed-time=10080

#当种子的分享率达到这个数时, 自动停止做种, 0为一直做种, 默认:1.0
seed-ratio=3.0



# PT 模式（严格）
# enable-dht=false
# enable-dht6=false
# bt-enable-lpd=false
# enable-peer-exchange=false

# BT 公网模式（可用 DHT）
# enable-dht=true
# enable-dht6=true
# bt-enable-lpd=true
# enable-peer-exchange=true


########## ########## ########## ########## 任务进度保存相关 ########## ########## ########## ##########

# 启动时从会话文件中读取下载任务 - 这里注销掉改为命令行中运行
# input-file=aria2-save.session

# 在Aria2c退出时保存 [错误 / 未完成] 的下载任务到会话文件 - 这里注销掉改为命令行中运行
# save-session=aria2-save.session 

# 保存间隔 - 下载任务的控制文件, 单位: 秒
auto-save-interval=10

# 保存间隔 - 定时保存会话 [错误 / 未完成] 的下载任务, 0为退出时才保存, 需1.16.1以上版本, 默认:0秒
save-session-interval=10

#保留未完成的任务
keep-unfinished-download-result=true

#保留的下载结果数量
max-download-result=2048

# 保存磁力链接元数据为种子文件(.torrent文件), 默认:false
bt-save-metadata=true

# 加载已保存的元数据文件 Default: false
bt-load-saved-metadata=true

# 保存上传的种子文件  Default: true
rpc-save-upload-metadata=true

# 如果给出 false，当片段长度与控制文件中的长度不同时，aria2 将中止下载。
# 如果给出 true，您可以继续，但一些下载进度将会丢失。默认值：假 Default: false
allow-piece-length-change=true

# BT Tracker 连接超时时间, 单位: 秒, 默认值: 60
bt-tracker-connect-timeout=30

# BT Tracker 上报间隔?  单位: 秒, 默认值: 0(根据进度确定)
bt-tracker-interval=60

