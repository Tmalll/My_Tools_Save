<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Temp Note</title>
    <style>
        html {
            height: 100%;
            display: flex;
            color-scheme: light dark;
        }
        body {
            flex: 1;
            display: flex;
            flex-direction: column;
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #t {
            position: sticky;
            padding: 8px 0;
            inset: 0 0 auto;
            gap: 8px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #t button, #t input[type="text"] {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        #t input[type="text"] {
            border: 1px solid #ccc;
            outline: none;
            background: transparent;
            max-width: 150px;
        }
        #t button {
            cursor: pointer;
            background: #eee;
            border: 1px solid #ccc;
            display: inline-flex;
            align-items: center;
            font-weight: 500;
            color: #000;
        }
        #t button:hover {
            background: #ddd;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            outline: none;
            text-align: left;
            min-height: 3.5rem;
        }
        .divider {
            border: none;
            border-top: 2px solid rgba(0,0,0,0.75);
            margin: 0 0 20px 0;
            width: 100%;
        }
        #e {
            flex: 1;
            outline: none;
            font-size: 1.1rem;
            text-align: left;
            color: #333;
            min-height: 400px;
        }
        #e img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            display: block;
        }
        [contenteditable]:empty::before {
            content: attr(placeholder);
            color: #aaa;
            font-weight: normal;
            pointer-events: none;
        }
    </style>
    <script>
        // 1. 实时同步输入框到网页标题
        function updateTitle() {
            let val = document.getElementById('titleInput').value;
            document.title = val || "HTML Temp Note";
            document.getElementById('h').innerText = val;
        }

        // 2. 核心：复制当前的全新 DataURL 网页（包含你刚写的所有内容和图片）
        function copyPageContent() {
            // 清空输入框的值，避免生成的代码里残留输入框文字
            document.getElementById('titleInput').value = "";
            
            var tempInput = document.createElement("textarea");
            // 采用更具现代浏览器兼容性的 utf-8 编码打包方式
            tempInput.value = 'data:text/html;charset=utf-8,' + encodeURIComponent('<!DOCTYPE HTML>\n' + document.documentElement.outerHTML);
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("包含最新内容的网页地址已成功复制到剪贴板！\n您可以直接将它粘贴到浏览器地址栏回车，或者收藏为书签。");
        }

        // 3. 拦截功能：防误触刷新、防不小心关闭网页导致内容丢失
        window.addEventListener("beforeunload", function (e) {
            // 当触发退出时，现代浏览器会弹出标准的确认提示框
            e.preventDefault();
            e.returnValue = ""; 
        });
    </script>
</head>
<body>
    <div id="t">
        <!-- 标题快速修改区 -->
        <input type="text" id="titleInput" placeholder="输入新标题..." oninput="updateTitle()">
        
        <button onclick="if(confirm('确定要清空所有内容吗？')){h.innerHTML='';e.innerHTML='';}">Clear</button>
        <button onclick="a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE HTML>\n'+document.documentElement.outerHTML);a.download=(h.innerText.trim()||'note')+'.html';a.click()">Save as HTML</button>
        <button onclick="a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(e.innerText);a.download=(h.innerText.trim()||'note')+'.txt';a.click()">Save as TXT</button>
        <button onclick="i.click()">Insert Image</button>
        
        <!-- 这里融合了您新提供的智能 Copy 功能 -->
        <button onclick="copyPageContent()" style="background-color: #d1e7dd; border-color: #a3cfbb;">智能复制 (Copy)</button>
        
        <input type="file" id="i" accept="image/*" style="display:none" onchange="let f=this.files[0];if(f){let r=new FileReader();r.onload=function(event){let img=document.createElement('img');img.src=event.target.result;e.appendChild(img);};r.readAsDataURL(f);this.value='';}">
        <a hidden id="a"></a>
    </div>

    <!-- 这里的 id="h" 与上面的输入框联动 -->
    <h1 id="h" contenteditable="true" placeholder="Title..."></h1>
    <hr class="divider">
    <div id="e" contenteditable="true" placeholder="Type your notes here...支持拖拽或粘贴图片..."></div>
</body>
</html>
