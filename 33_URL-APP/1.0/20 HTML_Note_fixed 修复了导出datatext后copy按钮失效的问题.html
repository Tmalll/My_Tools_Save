<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Note</title><style>
html,body{margin:0;padding:0;background:#fff;color:#000;font-family:system-ui,sans-serif}body{max-width:900px;margin:auto;padding:14px;box-sizing:border-box}#top{position:sticky;top:0;z-index:999;background:#fff;padding-bottom:12px}#size{font-size:12px;color:#666;line-height:1.4;margin-bottom:6px;user-select:none}#tips{font-size:11px;color:#777;line-height:1.5;margin-bottom:10px;user-select:none}#tips b{color:#444}#r{width:100%;height:52px;resize:none;overflow:auto;box-sizing:border-box;padding:8px;border:1px solid #aaa;border-radius:4px;font-size:13px;margin-bottom:10px}#t{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}#t button{flex:1 1 calc(25% - 8px);min-width:120px;padding:10px 8px;border:1px solid #bbb;background:#eee;border-radius:4px;cursor:pointer;color:#000;font-size:14px}#t button:hover{background:#ddd}h1{margin:0 0 12px;font-size:2rem;outline:none;min-height:2.5rem}hr{border:none;border-top:2px solid #000;margin:0 0 16px}#e{min-height:400px;outline:none;font-size:1.05rem;word-break:break-word}#e img{display:block;max-width:100%;margin:10px 0}[contenteditable]:empty:before{content:attr(placeholder);color:#888}#toast{position:absolute;background:#333;color:#fff;padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:9999}@media(max-width:700px){#t button{flex:1 1 calc(50% - 8px);min-width:unset}h1{font-size:1.6rem}}
</style><script>
f=s=>new Blob([s]).size;fmt=b=>{if(b<1024)return b.toFixed(0)+' B';u=['KB','MB','GB','TB'];i=-1;do{b/=1024;i++}while(b>=1024&&i<u.length-1);return b.toFixed(2)+' '+u[i]};sync=()=>document.title=h.innerText.trim()||'HTML Note';uSize=()=>{x=document.documentElement.outerHTML.length;real=x;dt=x*1.33;size.innerHTML='Real Size : '+fmt(real)+' / DataText Size : '+fmt(dt)};b64=a=>{let s='',c=0x8000;for(let i=0;i<a.length;i+=c)s+=String.fromCharCode(...a.subarray(i,i+c));return btoa(s)};ub64=s=>{b=atob(s);u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
tpl=(th,eh)=>`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${(h.innerText.trim()||'HTML Note').replace(/</g,'&lt;')}</title><style>${document.querySelector('style').innerHTML}</style><script>${document.querySelector('script').innerHTML.replace(/<\/script>/g,'<\\/script>')}<\/script></head><body><div id="toast"></div><div id="top"><div id="size"></div><div id="tips"><b>Address Bar</b> : &lt; 512K (512000 chars)<br><b style="font-size:13px">Restore Box</b> : Recommended &lt; 5MB<br><b>Import .DataText</b> : Recommended &gt; 5MB</div><textarea id="r" placeholder="Restore BOX | Paste DataText here for restore... | Recommended &lt; 5MB"></textarea><div id="t"><button onclick="restoreBox(event)">Restore For BOX</button><button onclick="copyDT(event)">Copy DataText</button><button onclick="clr()">Clear</button><button onclick="img.click()">Insert Image</button><button onclick="saveHTML()">Save HTML</button><button onclick="saveTXT()">Save TEXT</button><button onclick="imp.click()">Input .DataText Files</button><button onclick="outDT()">Output .DataText Files</button><input hidden type="file" id="img" accept="image/*" onchange="ins(this.files[0]);this.value=''"><input hidden type="file" id="imp" accept=".DataText,.txt" onchange="impDT(this.files[0]);this.value=''"><a hidden id="a"></a></div></div><h1 id="h" contenteditable="true" placeholder="Title..." oninput="sync();uSize()">${th}</h1><hr><div id="e" contenteditable="true" placeholder="Type your notes here..." oninput="uSize()">${eh}</div></body></html>`;
gen=()=>{html=tpl(h.innerHTML,e.innerHTML);bytes=new TextEncoder().encode(html);return{html,data:'data:text/html;base64,'+b64(bytes)}};dl=(n,t,d)=>{u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
showToast=(msg,x,y)=>{const t=document.getElementById('toast');if(!t)return;t.innerText=msg;t.style.left=x+'px';t.style.top=y+'px';t.style.opacity='1';clearTimeout(t.hideTimeout);t.hideTimeout=setTimeout(()=>{t.style.opacity='0'},1500)};

// ★ 核心修复：clipboard API 在 data: URL (null origin) 下会 TypeError
// 方案：先尝试现代 API，失败则用 execCommand 降级兜底（在 null origin 下仍可用）
clipWrite=async text=>{
  // 优先用现代 API（https / file:// 下可用）
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  }
  // 降级：textarea + execCommand（data: URL / 旧浏览器 兜底）
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  const ok=document.execCommand('copy');
  document.body.removeChild(ta);
  if(ok)return true;
  throw new Error('execCommand failed');
};

copyDT=async evt=>{
  const px=evt.pageX,py=evt.pageY;
  try{
    g=gen();
    const dt=g.data;
    if(f(dt)>5*1024*1024){showToast('DataText too large for clipboard',px,py);return;}
    await clipWrite(dt);
    showToast('DataText copied!',px,py);
  }catch(err){showToast('Copy failed: '+err.message,px,py)}
};
outDT=()=>{g=gen();dl((h.innerText.trim()||'#HTML_Note')+'.DataText','application/octet-stream',g.data)};saveHTML=()=>{g=gen();dl((h.innerText.trim()||'#HTML_Note')+'.html','text/html',g.html)};saveTXT=()=>{dl((h.innerText.trim()||'#HTML_Note')+'.txt','text/plain',e.innerText)};clr=()=>{if(confirm('Clear all content?')){h.innerHTML='';e.innerHTML='';sync();uSize();}};ins=file=>{if(!file)return;r=new FileReader();r.onload=x=>{i=document.createElement('img');i.src=x.target.result;e.appendChild(i);uSize()};r.readAsDataURL(file)};restore=s=>{try{s=s.trim();if(!s.startsWith('data:text/html;base64,')){alert('Invalid DataText');return;}b=s.split(',')[1];h2=new TextDecoder().decode(ub64(b));document.open();document.write(h2);document.close()}catch(err){alert('Restore failed: '+err)}};restoreBox=evt=>{const px=evt.pageX,py=evt.pageY;if(!r.value.trim()){showToast('Restore box is empty',px,py);return;}restore(r.value);};impDT=file=>{if(!file)return;r2=new FileReader();r2.onload=x=>restore(x.target.result);r2.readAsText(file)};addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue='Are you sure you want to leave?'});addEventListener('load',()=>uSize());
</script></head><body>
<div id="toast"></div>
<div id="top"><div id="size"></div><div id="tips"><b>Address Bar</b> : &lt; 512K (512000 chars)<br><b style="font-size:13px">Restore Box</b> : Recommended &lt; 5MB<br><b>Import .DataText</b> : Recommended &gt; 5MB</div>
<textarea id="r" placeholder="Restore BOX | Paste DataText here for restore... | Recommended < 5MB"></textarea>
<div id="t">
<button onclick="restoreBox(event)">Restore For BOX</button>
<button onclick="copyDT(event)">Copy DataText</button>
<button onclick="clr()">Clear</button>
<button onclick="img.click()">Insert Image</button>
<button onclick="saveHTML()">Save HTML</button>
<button onclick="saveTXT()">Save TEXT</button>
<button onclick="imp.click()">Input .DataText Files</button>
<button onclick="outDT()">Output .DataText Files</button>
<input hidden type="file" id="img" accept="image/*" onchange="ins(this.files[0]);this.value=''">
<input hidden type="file" id="imp" accept=".DataText,.txt" onchange="impDT(this.files[0]);this.value=''">
<a hidden id="a"></a>
</div></div>
<h1 id="h" contenteditable="true" placeholder="Title..." oninput="sync();uSize()"></h1>
<hr>
<div id="e" contenteditable="true" placeholder="Type your notes here..." oninput="uSize()"></div>
</body></html>
