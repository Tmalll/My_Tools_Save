<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Temp Note</title>
    <style>
        html {
            height: 100%;
            display: flex;
            color-scheme: light dark;
        }
        body {
            flex: 1;
            display: flex;
            flex-direction: column;
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #t {
            position: sticky;
            padding: 8px 0;
            inset: 0 0 auto;
            gap: 8px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #t button {
            cursor: pointer;
            padding: 6px 12px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            font-weight: 500;
        }
        #t button:hover {
            background: #ddd;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            outline: none;
            text-align: left;
            min-height: 3.5rem;
        }
        .divider {
            border: none;
            border-top: 2px solid rgba(0,0,0,0.75);
            margin: 0 0 20px 0;
            width: 100%;
        }
        #e {
            flex: 1;
            outline: none;
            font-size: 1.1rem;
            text-align: left;
            color: #333;
            min-height: 400px;
        }
        #e img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            display: block;
        }
        [contenteditable]:empty::before {
            content: attr(placeholder);
            color: #aaa;
            font-weight: normal;
            pointer-events: none;
        }
    </style>
    <script>
        // Synchronize h1 text to document title in real time
        function syncTitle() {
            document.title = document.getElementById('h').innerText.trim() || "HTML Temp Note";
        }

        // Helper function to generate full Base64 DataURL of the current page state
        function generateDataText() {
            // Force browser to update the DOM attributes for contenteditable fields so states are preserved
            document.getElementById('h').setAttribute('data-current', document.getElementById('h').innerHTML);
            document.getElementById('e').setAttribute('data-current', document.getElementById('e').innerHTML);
            
            const htmlContent = '<!DOCTYPE HTML>\n' + document.documentElement.outerHTML;
            return 'data:text/html;base64,' + btoa(unescape(encodeURIComponent(htmlContent)));
        }

        // Copy DataText to clipboard (with full text and image preservation)
        function copyDataText() {
            const dt = generateDataText();
            navigator.clipboard.writeText(dt).then(() => {
                alert('DataText copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        // Download the current state as a DataText file
        function downloadDataText() {
            const dt = generateDataText();
            const fileName = (document.getElementById('h').innerText.trim() || 'note') + '_datatext.html';
            const downloadAnchor = document.getElementById('a');
            downloadAnchor.href = 'data:text/html;charset=utf-8,' + encodeURIComponent('<script>window.location.href="' + dt + '"<\/script>');
            downloadAnchor.download = fileName;
            downloadAnchor.click();
        }

        // Prevent accidental browser refresh or exit
        window.addEventListener("beforeunload", function (e) {
            e.preventDefault();
            e.returnValue = ""; 
        });

        // Restore innerHTML states if reloaded from a data-preset package
        window.addEventListener("DOMContentLoaded", () => {
            const h = document.getElementById('h');
            const e = document.getElementById('e');
            if(h.hashAttribute && h.getAttribute('data-current')) h.innerHTML = h.getAttribute('data-current');
            if(e.hashAttribute && e.getAttribute('data-current')) e.innerHTML = e.getAttribute('data-current');
            syncTitle();
        });
    </script>
</head>
<body>
    <div id="t">
        <button onclick="if(confirm('Clear all content?')){h.innerHTML='';e.innerHTML='';syncTitle();}">Clear</button>
        <button onclick="a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE HTML>\n'+document.documentElement.outerHTML);a.download=(h.innerText.trim()||'note')+'.html';a.click()">Save as HTML</button>
        <button onclick="a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(e.innerText);a.download=(h.innerText.trim()||'note')+'.txt';a.click()">Save as TXT</button>
        <button onclick="i.click()">Insert Image</button>
        <button onclick="copyDataText()">Copy DataText</button>
        <button onclick="downloadDataText()">Download DataText</button>
        
        <input type="file" id="i" accept="image/*" style="display:none" onchange="let f=this.files[0];if(f){let r=new FileReader();r.onload=function(event){let img=document.createElement('img');img.src=event.target.result;e.appendChild(img);};r.readAsDataURL(f);this.value='';}">
        <a hidden id="a"></a>
    </div>

    <h1 id="h" contenteditable="true" placeholder="Title..." oninput="syncTitle()"></h1>
    <hr class="divider">
    <div id="e" contenteditable="true" placeholder="Type your notes here..."></div>
</body>
</html>
