<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Temp Note</title>
    <style>
        /* Force light theme - lock to white background and black text */
        html, body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Toolbar configuration */
        #t {
            position: sticky;
            padding: 8px 0;
            inset: 0 0 auto;
            gap: 8px;
            display: flex;
            flex-wrap: wrap; /* Allows wrapping into multiple rows on mobile */
            align-items: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
            background-color: #ffffff;
            z-index: 10;
        }
        #t button {
            cursor: pointer;
            padding: 10px 12px; /* Marginally increased for better mobile tapping */
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: #000000;
            flex: 1 1 calc(16.66% - 8px); /* Default desktop single row */
            min-width: 80px;
            box-sizing: border-box;
        }
        #t button:hover {
            background: #ddd;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            outline: none;
            text-align: left;
            min-height: 3rem;
            color: #000000;
        }
        .divider {
            border: none;
            border-top: 2px solid rgba(0, 0, 0, 0.75);
            margin: 0 0 20px 0;
            width: 100%;
        }
        #e {
            outline: none;
            font-size: 1.1rem;
            text-align: left;
            color: #111111;
            min-height: 400px;
            word-wrap: break-word;
        }
        #e img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            display: block;
        }
        [contenteditable]:empty::before {
            content: attr(placeholder);
            color: #999;
            font-weight: normal;
            pointer-events: none;
        }

        /* Mobile specific layout optimization (width < 600px) */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            #t {
                gap: 10px; /* Enhanced gap for mobile layout */
            }
            /* Transforms buttons into 2 columns layout matching your sketch */
            #t button {
                flex: 1 1 calc(50% - 5px); 
                padding: 12px 8px; /* Touch friendly height */
                font-size: 14px;
            }
            h1 {
                font-size: 1.8rem;
                min-height: 2.5rem;
            }
        }
    </style>
    <script>
        // Sync the h1 user text to browser tab title
        function syncTitle() {
            document.title = document.getElementById('h').innerText.trim() || "HTML Temp Note";
        }

        // Helper function to bundle the current live DOM state into a valid Base64 DataURL
        function generateBase64DataText() {
            const currentTitleHtml = document.getElementById('h').innerHTML;
            const currentBodyHtml = document.getElementById('e').innerHTML;
            const documentTitle = document.getElementById('h').innerText.trim() || "HTML Temp Note";

            const dynamicSource = `<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${documentTitle}</title>
    <style>
        html, body { background-color: #ffffff; color: #000000; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        #t { position: sticky; padding: 8px 0; inset: 0 0 auto; gap: 8px; display: flex; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 20px; background-color: #ffffff; z-index: 10; }
        #t button { cursor: pointer; padding: 10px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; color: #000000; flex: 1 1 calc(16.66% - 8px); min-width: 80px; box-sizing: border-box; }
        #t button:hover { background: #ddd; }
        h1 { font-size: 2.2rem; font-weight: bold; margin: 0 0 15px 0; outline: none; text-align: left; min-height: 3rem; color: #000000; }
        .divider { border: none; border-top: 2px solid rgba(0, 0, 0, 0.75); margin: 0 0 20px 0; width: 100%; }
        #e { outline: none; font-size: 1.1rem; text-align: left; color: #111111; min-height: 400px; word-wrap: break-word; }
        #e img { max-width: 100%; height: auto; margin: 10px 0; display: block; }
        [contenteditable]:empty::before { content: attr(placeholder); color: #999; font-weight: normal; pointer-events: none; }
        @media (max-width: 600px) {
            body { padding: 15px; }
            #t { gap: 10px; }
            #t button { flex: 1 1 calc(50% - 5px); padding: 12px 8px; font-size: 14px; }
            h1 { font-size: 1.8rem; min-height: 2.5rem; }
        }
    </style>
    <script>
        function syncTitle() { document.title = document.getElementById('h').innerText.trim() || "HTML Temp Note"; }
        ${copyDataText.toString()}
        ${generateBase64DataText.toString()}
        ${downloadDataText.toString()}
        window.addEventListener("beforeunload", function (e) { e.preventDefault(); e.returnValue = ""; });
    <\/script>
</head>
<body>
    <div id="t">
        <button onclick="if(confirm('Clear all content?')){h.innerHTML='';e.innerHTML='';syncTitle();}">Clear</button>
        <button onclick="a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE HTML>\\n'+document.documentElement.outerHTML);a.download=(h.innerText.trim()||'note')+'.html';a.click()">Save as HTML</button>
        <button onclick="a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(e.innerText);a.download=(h.innerText.trim()||'note')+'.txt';a.click()">Save as TXT</button>
        <button onclick="i.click()">Insert Image</button>
        <button onclick="copyDataText()">Copy DataText</button>
        <button onclick="downloadDataText()">Download DataText</button>
        <input type="file" id="i" accept="image/*" style="display:none" onchange="let f=this.files[0];if(f){let r=new FileReader();r.onload=function(event){let img=document.createElement('img');img.src=event.target.result;e.appendChild(img);};r.readAsDataURL(f);this.value='';}">
        <a hidden id="a"></a>
    </div>
    <h1 id="h" contenteditable="true" placeholder="Title..." oninput=\"syncTitle()\">${currentTitleHtml}</h1>
    <hr class="divider">
    <div id="e" contenteditable="true" placeholder="Type your notes here...">${currentBodyHtml}</div>
</body>
</html>`;

            return 'data:text/html;base64,' + btoa(unescape(encodeURIComponent(dynamicSource)));
        }

        // Copy Base64 DataText string to clipboard
        function copyDataText() {
            const base64Uri = generateBase64DataText();
            const tempBox = document.createElement("textarea");
            tempBox.value = base64Uri;
            document.body.appendChild(tempBox);
            tempBox.select();
            
            try {
                if (document.execCommand("copy")) {
                    alert('Base64 DataText successfully copied to clipboard!');
                } else {
                    alert('Copy execution failed.');
                }
            } catch (err) {
                alert('Execution error: ' + err);
            }
            document.body.removeChild(tempBox);
        }

        // Download the Base64 DataText string as a raw plain text file (.txt)
        function downloadDataText() {
            const base64Uri = generateBase64DataText();
            const fileName = (document.getElementById('h').innerText.trim() || 'note') + '_datatext.txt';
            const downloadAnchor = document.getElementById('a');
            
            downloadAnchor.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(base64Uri);
            downloadAnchor.download = fileName;
            downloadAnchor.click();
        }

        // Anti-refresh interception
        window.addEventListener("beforeunload", function (e) {
            e.preventDefault();
            e.returnValue = ""; 
        });
    </script>
</head>
<body>
    <div id="t">
        <button onclick="if(confirm('Clear all content?')){h.innerHTML='';e.innerHTML='';syncTitle();}">Clear</button>
        <button onclick="a.href='data:text/html;charset=utf-8,'+encodeURIComponent('<!DOCTYPE HTML>\n'+document.documentElement.outerHTML);a.download=(h.innerText.trim()||'note')+'.html';a.click()">Save as HTML</button>
        <button onclick="a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(e.innerText);a.download=(h.innerText.trim()||'note')+'.txt';a.click()">Save as TXT</button>
        <button onclick="i.click()">Insert Image</button>
        <button onclick="copyDataText()">Copy DataText</button>
        <button onclick="downloadDataText()">Download DataText</button>
        
        <input type="file" id="i" accept="image/*" style="display:none" onchange="let f=this.files[0];if(f){let r=new FileReader();r.onload=function(event){let img=document.createElement('img');img.src=event.target.result;e.appendChild(img);};r.readAsDataURL(f);this.value='';}">
        <a hidden id="a"></a>
    </div>

    <h1 id="h" contenteditable="true" placeholder="Title..." oninput="syncTitle()"></h1>
    <hr class="divider">
    <div id="e" contenteditable="true" placeholder="Type your notes here..."></div>
</body>
</html>
