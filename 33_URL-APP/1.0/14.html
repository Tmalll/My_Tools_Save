<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Temp Note</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#fff;
    color:#000;
    font-family:system-ui,sans-serif;
}

body{
    max-width:900px;
    margin:auto;
    padding:16px;
    box-sizing:border-box;
}

#t{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:8px 0;
    margin-bottom:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

#t button{
    flex:1 1 calc(16.66% - 8px);
    min-width:90px;
    padding:10px;
    cursor:pointer;
    border:1px solid #bbb;
    border-radius:4px;
    background:#eee;
    color:#000;
}

#t button:hover{
    background:#ddd;
}

h1{
    margin:0 0 12px;
    font-size:2rem;
    outline:none;
    min-height:2.5rem;
}

hr{
    border:none;
    border-top:2px solid #000;
    margin:0 0 16px;
}

#e{
    min-height:400px;
    outline:none;
    font-size:1.05rem;
    word-break:break-word;
}

#e img{
    display:block;
    max-width:100%;
    margin:10px 0;
}

[contenteditable]:empty:before{
    content:attr(placeholder);
    color:#888;
}

@media(max-width:600px){
    #t button{
        flex:1 1 calc(50% - 8px);
    }

    h1{
        font-size:1.6rem;
    }
}
</style>

<script>
function syncTitle(){
    document.title = h.innerText.trim() || 'HTML Temp Note';
}

function bytesToBase64(bytes){
    let binary = '';
    const chunk = 0x8000;

    for(let i=0;i<bytes.length;i+=chunk){
        binary += String.fromCharCode(...bytes.subarray(i,i+chunk));
    }

    return btoa(binary);
}

function base64ToBytes(base64){
    const bin = atob(base64);
    const len = bin.length;
    const bytes = new Uint8Array(len);

    for(let i=0;i<len;i++){
        bytes[i] = bin.charCodeAt(i);
    }

    return bytes;
}

return `<!DOCTYPE html>

<script>

    let binary = '';

        binary += String.fromCharCode(...bytes.subarray(i,i+chunk));
    }

    return btoa(binary);

function buildHTML(titleHTML, bodyHTML){

return document.documentElement.outerHTML;
}

function generateDataText(){

    const html = buildHTML(

        e.innerHTML
    );

    const bytes = new TextEncoder().encode(html);

    return 'data:text/html;base64,' + bytesToBase64(bytes);
}

async function copyDataText(){

    try{

        alert('Copied');
    }catch(err){

    }
}

function downloadDataText(){

    const blob = new Blob(
        [generateDataText()],
        {type:'text/plain'}
    );

    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = (h.innerText.trim() || 'note') + '_datatext.txt';
    a.click();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);
}

function saveHTML(){

    const html = buildHTML(
        h.innerHTML,
        e.innerHTML
    );

    const blob = new Blob(
        [html],
        {type:'text/html'}
    );

    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = (h.innerText.trim() || 'note') + '.html';
    a.click();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);
}

function clearAll(){

    if(confirm('Clear all content?')){

    }
}

function insertImage(file){

    if(!file) return;

    const reader = new FileReader();

    reader.onload = ev => {

        const img = document.createElement('img');

        img.src = ev.target.result;

        e.appendChild(img);
    };

    reader.readAsDataURL(file);
}

window.addEventListener(

    e=>{
        e.preventDefault();
        e.returnValue='';
    }
);
