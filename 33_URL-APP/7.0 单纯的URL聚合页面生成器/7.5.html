<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookmark Aggregator</title>
    <style>
        body{font-family:sans-serif;max-width:800px;margin:20px auto;padding:0 15px;color:#18181b}
        .ctls{display:flex;gap:8px;margin-bottom:20px}
        button{padding:6px 12px;cursor:pointer;background:#f4f4f5;border:1px solid #d4d4d8;border-radius:4px;font-size:13px}
        .b-d{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
        #h{font-size:24px;outline:0;border-bottom:1px solid #e4e4e7;padding-bottom:5px}
        #e{min-height:400px;outline:0;margin-top:15px;white-space:pre-wrap;word-break:break-all}
        [contenteditable]:empty:before{content:attr(placeholder);color:#9ca3af}
        #t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;padding:6px 16px;border-radius:4px;font-size:12px;opacity:0;pointer-events:none}
    </style>
</head>
<body>
<div class="ctls">
    <button class="b-d" onclick="clr()">Clear</button>
    <button onclick="cpEd()">Copy Editor</button>
    <button onclick="svPg()">Save Page</button>
    <button onclick="cpPg()">Copy Page</button>
</div>
<h1 id="h" contenteditable="true" placeholder="Title..."></h1>
<div id="e" contenteditable="true" placeholder="Type here (URLs auto-link)..."></div>
<div id="t"></div>
<script>
    const h = document.getElementById('h'), e = document.getElementById('e'), t = document.getElementById('t');
    const b64 = s => btoa(unescape(encodeURIComponent(s)));
    const tip = m => { t.innerText = m; t.style.opacity = '1'; clearTimeout(window.to); window.to = setTimeout(() => t.style.opacity = '0', 1000); };
    const cp = (txt, m) => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); tip(m); } catch(e) { tip('Failed'); } document.body.removeChild(ta); };
    const clr = () => { h.innerText = ''; e.innerText = ''; tip('Cleared'); };
    const enc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const getH = () => {
        const c = e.innerText.split(/(\s+)/).map(p => (p.startsWith('http://') || p.startsWith('https://')) ? `<a href="${enc(p)}" target="_blank" style="color:#2563eb;text-decoration:underline;">${p}</a>` : p).join('');
        return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${h.innerText||'Note'}</title></head><body><h1>${h.innerText}</h1><div style="white-space:pre-wrap;word-break:break-all;">${c}</div></body></html>`;
    };
    function cpEd() {
        const sty = document.getElementsByTagName('style')[0].innerHTML;
        const scr = document.getElementsByTagName('script')[0].innerHTML;
        cp('data:text/html;base64,' + b64(`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Bookmark Aggregator</title><style>${sty}</style></head><body><div class="ctls"><button class="b-d" onclick="clr()">Clear</button> <button onclick="cpEd()">Copy Editor</button> <button onclick="svPg()">Save Page</button> <button onclick="cpPg()">Copy Page</button></div><h1 id="h" contenteditable="true" placeholder="Title..."></h1><div id="e" contenteditable="true" placeholder="Type here (URLs auto-link)..."></div><div id="t"></div>\<script>${scr}\<\/script></body></html>`), 'Editor Copied');
    }
    const cpPg = () => cp('data:text/html;base64,' + b64(getH()), 'Page Copied');
    function svPg() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([getH()], {type: 'text/html'})); a.download = (h.innerText.trim() || 'Bookmark Aggregator') + '.html'; a.click(); tip('Downloaded'); }
</script>
</body>
</html>
