    - DOMAIN,broadcastlv.chat.bilibili.com,REJECT-DROP  # 疑似直播弹幕人气值统计用的
  BiliBili_APP_Allow:
    # B站CDN
    - GEOSITE,bilibili-cdn,HidePROXY
    #- DOMAIN-SUFFIX,edge.mountaintoys.cn,MuMuPlayer_PROXY # PCDN
    #- DOMAIN-SUFFIX,zhenidc.cn,MuMuPlayer_PROXY # PCDN
    #- DOMAIN-SUFFIX,nexusedgeio.com,MuMuPlayer_PROXY # PCDN
    #- DOMAIN-SUFFIX,qrstuvwxyzab.com,MuMuPlayer_PROXY # PCDN
    #- DOMAIN-SUFFIX,v.smtcdns.com,MuMuPlayer_PROXY # PCDN

    # 核心API接口
