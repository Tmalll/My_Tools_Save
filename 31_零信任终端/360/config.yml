    - DOMAIN,mall.bilibili.com,REJECT-DROP
    - DOMAIN,mall.bilibili.cn,REJECT-DROP
    - DOMAIN,club.bilibili.com,REJECT-DROP # 会员购
    
    # B站客户端APP, 疑似遥测域名
    #- DOMAIN,bilistatic.cn,REJECT-DROP # 疑似遥测域名
    - DOMAIN,cm.bilibili.com,REJECT-DROP # 遥测与行为统计!!!
    - DOMAIN,data.bilibili.com,REJECT-DROP # 交互行为上报域名
    - DOMAIN,dataflow.biliapi.com,REJECT-DROP # 交互行为上报域名
    
    # B站客户端APP, 疑似广告域名
    - DOMAIN-SUFFIX,yirujs.com,REJECT-DROP
    - DOMAIN,api.iegadp.qq.com,REJECT-DROP # 广告
    - DOMAIN,android.bugly.qq.com,REJECT-DROP # 异常上报
