# 基础设置
mixed-port: 10800                         # http/socks5 对外服务端口
allow-lan: true                           # 上面的是否允许局域网连接
ipv6: true                                # IPv6 总开关
geodata-mode: true                        # 使用geoip.dat数据库
external-controller: 127.3.3.3:80         # WebUI控制器端口 | 配合hosts可使用 http://clash.meta/ui/#/proxies 来进行登录.
log-level: info                           # 日志等级（ silent / error / warning / info / debug ）

# 子规则
sub-rules:
  Auto_PR:
    - GEOSITE,category-ads-all,AutoPR_REJECT # 屏蔽广告域名
    - GEOSITE,geolocation-!cn,AutoPR_PROXY   # 非中国
    - GEOSITE,cn,AutoPR_PROXY                # 中国域名
    - GEOIP,cn,AutoPR_PROXY                  # 中国IP
    - MATCH,AutoPR_PROXY                     # 漏网之鱼, 兜底
  MuMu_REJECT:
    # UDP
    - AND,((NETWORK,UDP),(DST-PORT,123),(DOMAIN,time.android.com)),HidePROXY # 放行NTP
    - AND,((NETWORK,UDP),(DST-PORT,123),(GEOSITE,category-ntp)),HidePROXY # 放行NTP
    - AND,((NETWORK,UDP),(DST-PORT,53)),MuMuPlayer_PROXY # 放行DNS
    - AND,((NETWORK,UDP),(DST-PORT,80),(GEOSITE,youtube)),REJECT-DROP  # 禁止YT-UDP连接
    - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,youtube)),REJECT-DROP  # 禁止YT-UDP连接
    - AND,((NETWORK,UDP),(DST-PORT,80),(GEOSITE,google)),REJECT-DROP  # 禁止YT-UDP连接
    - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,google)),REJECT-DROP  # 禁止YT-UDP连接
    - NETWORK,UDP,REJECT  # 禁止剩余的UDP连接, 显示被阻止的连接
    
    # 广告\遥测\监控
    - GEOSITE,category-ads-all,REJECT-DROP # 屏蔽广告域名
    - GEOSITE,category-number-verification-cn,REJECT-DROP # 中国互联网服务提供商提供的SDK被应用程序用于通过蜂窝网络确定电话号码。
    - GEOSITE,category-httpdns-cn,REJECT-DROP # 全是广告的合集, 应该是APP内置DNS劫持.
        
    # 疑似内置遥测
    #- DOMAIN-SUFFIX,mumu.163.com,MuMuPlayer_REJECT     # 遥测主域名
    #- DOMAIN-SUFFIX,uu.163.com,MuMuPlayer_REJECT       # 疑似加速器
    - DOMAIN,sentry.netease.com,REJECT-DROP
    - DOMAIN,sigma-fcount-webtech.proxima.nie.netease.com,REJECT-DROP # 疑似遥测上报
    - DOMAIN,hubble.mumu.163.com,REJECT-DROP            # 遥测上报
    - DOMAIN,report.mumu.nie.netease.com,REJECT-DROP    # 遥测上报
    - DOMAIN,api.mumu.nie.netease.com,REJECT-DROP       # 遥测上报
    - DOMAIN,store-api.mumu.163.com,REJECT-DROP         # 内置商店API, 在GooglePlay安装和打开应用后, 会弹出此域名的连接. # 疑似遥测 # 禁用这个安装APP的时候会解析很久
    - DOMAIN,dispatcher-mobile.uu.163.com,REJECT-DROP   # 看名字是移动版UU加速器调度用的域名?
    - DOMAIN,shence-api.mumu.163.com,REJECT-DROP        # 看名字是侧载用的.
    - DOMAIN,romsdk-mobile.uu.163.com,REJECT-DROP       # 看名字是UU加速器用的.
  MuMu_Allow:
    #- GEOSITE,geolocation-!cn,HidePROXY      # 非中国
    - GEOSITE,category-companies,HidePROXY    # 非中国以外的大型公司
    #- GEOSITE,google,HidePROXY               # 允许, Google
    #- GEOSITE,youtube,HidePROXY              # YouTube
    #- GEOSITE,microsoft,HidePROXY            # 允许, microsoft
    - GEOSITE,connectivity-check,HidePROXY    # 允许, 连通性检测网址
    - GEOIP,telegram,HidePROXY
  BiliBili_APP_REJECT:
    # B站客户端APP, 奇怪的IP, 疑似是httpDNS, 不显式禁用这玩意会卡封面娘.
    - GEOSITE,category-httpdns-cn,REJECT-DROP  # 应该是APP内置HTTPDNS
    - DOMAIN,httpdns.bilivideo.com,REJECT-DROP # 同上
    - IP-CIDR,203.119.206.0/24,REJECT-DROP,no-resolve
    - IP-CIDR,203.119.204.0/24,REJECT-DROP,no-resolve
    - IP-CIDR,203.119.238.0/24,REJECT-DROP,no-resolve
    - IP-CIDR,106.13.246.0/24,REJECT-DROP,no-resolve
    - IP-CIDR,106.13.254.0/24,REJECT-DROP,no-resolve
    - IP-CIDR,106.13.168.0/24,REJECT-DROP,no-resolve
   
    # B站客户端APP, 游戏域名, 不玩游戏可屏蔽.
    - GEOSITE,bilibili-game,REJECT-DROP
