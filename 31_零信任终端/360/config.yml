# 主要规则
rules:
  # Fallout4.exe
  - AND,((PROCESS-NAME,Fallout4.exe),(DOMAIN,api.bethesda.net)),HidePROXY
  - AND,((PROCESS-NAME,Fallout4.exe),(DOMAIN,titlestorage.bethesda.net)),HidePROXY
  - AND,((PROCESS-NAME,Fallout4.exe),(DOMAIN,us-east-1-prod-fo4prodbi01-glb-bps-bigateway.bgssvcprod.com)),HidePROXY


  #- SUB-RULE,(PROCESS-NAME,Foxmail.exe),Auto_PR

  # 内部链接, 用来更新GEO文件
  #- DOMAIN,github.com,HidePROXY
  #- GEOSITE,github,HidePROXY
  - AND,((IN-TYPE,INNER),(GEOSITE,github)),HidePROXY


  # MuMu模拟器, 虚拟机NAT网络规则
  #- PROCESS-NAME,MuMuVMMHeadless.exe,MuMuPlayer_PROXY # 忽略下面规则, 允许所有连接
  - SUB-RULE,(PROCESS-NAME,MuMuVMMHeadless.exe),MuMu_REJECT
  - SUB-RULE,(PROCESS-NAME,MuMuVMMHeadless.exe),MuMu_Allow
  - SUB-RULE,(PROCESS-NAME,MuMuVMMHeadless.exe),BiliBili_APP_REJECT
  - SUB-RULE,(PROCESS-NAME,MuMuVMMHeadless.exe),BiliBili_APP_Allow
  - AND,((PROCESS-NAME,MuMuVMMHeadless.exe),(DST-PORT,80)),MuMuPlayer_PROXY         # @显示审核@
  - AND,((PROCESS-NAME,MuMuVMMHeadless.exe),(DST-PORT,443)),MuMuPlayer_PROXY        # @显示审核@
  - PROCESS-NAME,MuMuVMMHeadless.exe,MuMuPlayer_REJECT # 兜底拒绝所有未允许的连接.  # @显示审核@

  # MuMu模拟器, 程序自身的规则
  - DOMAIN,report.mumu.nie.netease.com,REJECT-DROP  # 遥测与数据上报 +
  - DOMAIN,api.mumu.nie.netease.com,REJECT-DROP     # 模拟器核心服务端——版本检测、更新推送、消息中心、设备校验等, 也用于模拟器更新 +
  - PROCESS-NAME,MuMuNxUpdater.exe,REJECT-DROP # MuMu模拟器, 更新程序
  - DOMAIN,fcount-api.webapp.easebar.com,REJECT-DROP # 遥测与数据上报
  - DOMAIN,fcount-api.webapp.163.com,REJECT-DROP # 遥测与数据上报
  - DOMAIN,sentry.netease.com,REJECT-DROP # 遥测与数据上报
  - DOMAIN,api-pro.mumu.163.com,REJECT-DROP # 模拟器Pro版API——账号登录态、增值功能、云端配置下发
  - DOMAIN,event.sc.gearupportal.com,REJECT-DROP # 遥测与数据上报
  #- DOMAIN-SUFFIX,mumu.163.com,REJECT-DROP  # 遥测主域名
  #- DOMAIN-SUFFIX,uu.163.com,REJECT-DROP    # 疑似加速器

  # MuMu模拟器, 虚拟定位API
  - AND,((PROCESS-NAME,QtWebEngineProcess.exe),(DOMAIN,api.map.baidu.com)),HidePROXY
  - AND,((PROCESS-NAME,QtWebEngineProcess.exe),(DOMAIN-SUFFIX,bdimg.com)),HidePROXY
  
  
  

