    - DOMAIN,api.bilibili.com,HidePROXY # 这个不能屏蔽, 屏蔽了无法刷出视频.
    - DOMAIN,www.bilibili.com,HidePROXY # 主域名, 对于APP屏蔽了无影响, 但是无法用浏览器打开主页.
    - DOMAIN,grpc.biliapi.net,HidePROXY  # 屏蔽了影响相关视频加载速度, 影响弹幕加载速度, 视频详情加载速度, 影响搜索速度.
    - DOMAIN,app.biliapi.com,HidePROXY # 不能屏蔽, 屏蔽了主页无法刷出视频.
    - DOMAIN,app.biliapi.net,HidePROXY # 这个不能屏蔽, 屏蔽了无法刷出视频.
