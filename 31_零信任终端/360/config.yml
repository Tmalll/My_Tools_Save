# Tun模式
tun:
  enable: true
  device: mihomo_tun1 # 接口名称
  mtu: 9000
  stack: mixed # https://wiki.metacubex.one/config/inbound/tun/#stack
    # system 使用系统协议栈，可以提供更稳定/全面的 tun 体验，且占用相对其他堆栈更低
    # gvisor 通过在用户空间中实现网络协议栈，可以提供更高的安全性和隔离性，同时可以避免操作系统内核和用户空间之间的切换，从而在特定情况下具有更好的网络处理性能
    # mixed 混合堆栈，tcp 使用 system栈，udp 使用 gvisor栈，使用体验可能相对更好
    # 安卓上建议使用 gvisor 来获取更好的隐私性, 特别是国产手机中...
  ###  
  inet6-address: # https://wiki.metacubex.one/config/inbound/tun/#inet6-address
    - "6666:ffff:ffff:6666::1/126"
  # 不写这一段, tun模式无法接管IPv6
  # 目前会在程序启动时检查系统其他网卡是否有IPV6，如果不存在会禁用该功能，如果需要强制开启tun的v6地址，请手动设置SKIP_SYSTEM_IPV6_CHECK=1系统环境变量
  # 需要同时将顶层配置中的ipv6设置为true才会生效
  ###
  dns-hijack:
    - 'udp://any:53'
    #- 'any:53'                  # 开启劫持
    #- 'tcp://any:53'
    #- "111.111.111.111:53"     # 关闭劫持
  ###
  auto-detect-interface: true # 自动选择流量出口接口，多出口网卡同时连接的设备建议手动指定出口网卡
  #include-interface: # 指定出口网卡, 还有一个 exclude-interface 排除路由的接口，与 include-interface 冲突，不可一起配置
  #  - "以太网"
  ###
  #strict-route: true #  启用 auto-route 时执行严格的路由规则
    # 在 Linux 中:
    #   让不支持的网络无法到达
    #   将所有连接路由到 tun
    #   它可以防止地址泄漏，并使 DNS 劫持在 Android 上工作。
    # 在 Windows 中:
    #   添加防火墙规则以阻止 Windows 的 普通多宿主 DNS 解析行为 造成的 DNS 泄露
    #   它可能会使某些应用程序（如 VirtualBox）在某些情况下无法正常工作。
  ###
  auto-route: true
  route-address:
    - 0.0.0.0/1
    - 128.0.0.0/1
    - "::/1"
    - "8000::/1"
  route-exclude-address:
    # IPv4 私有网络地址段 (RFC 1918)
    - 10.0.0.0/8         # Class A 私有网络
    - 172.16.0.0/12      # Class B 私有网络
    - 192.168.0.0/16     # Class C 私有网络 (包含你的 192.168.1.0/24)
    # IPv4 特殊/本地环回地址
    - 127.0.0.0/8        # 本地环回地址 (Localhost, 确保 127.0.0.1 不走代理)
    - 169.254.0.0/16     # 链路本地地址 (APIPA)
    # IPv6 地址段
    - fc00::/7           # 独特的本地地址 (Unique Local Addresses, ULA)
    - fe80::/10          # 链路本地地址 (Link-local)
    - ::1/128            # IPv6 本地环回地址
    - ff00::/8           # 组播地址 (Multicast)
    #
    # 备注: 在fakeIP模式下如果以上排除段里包含了fakeIP所使用的网段, 会造成DNS解析问题!!!
